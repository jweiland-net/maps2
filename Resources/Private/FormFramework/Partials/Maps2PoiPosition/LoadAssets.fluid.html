<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:comment>
    <!--
    Assets of the map of the form element "Maps2PoiPosition". The identifiers
    are the same as in Partials/LoadAssets.html of the maps2 plugins, so the
    assets are loaded only once, if a maps2 plugin is on the same page.

    Arguments:
    mapProvider: "gm" or "osm"
    googleMapsJavaScriptApiKey: TypoScript setting plugin.tx_maps2.settings.googleMapsJavaScriptApiKey
                                or the extension setting of the same name
    -->
</f:comment>
<f:if condition="{mapProvider} == 'gm'">
    <f:then>
        <f:comment><!-- async has to be activated. Else "initMap" could not be found --></f:comment>
        <f:comment><!-- Adds the CSP nonce to the style tags, which are generated by Google Maps --></f:comment>
        <f:asset.css identifier="maps2-google-maps" csp="1" priority="1">;</f:asset.css>
        <f:asset.script identifier="maps2-google-maps-api"
                        src="https://maps.googleapis.com/maps/api/js?key={googleMapsJavaScriptApiKey -> f:format.urlencode()}&libraries=places&callback=initMap&loading=async"
                        async="1"
                        inline="0"
                        csp="1"/>
        <f:asset.script identifier="maps2-google-maps"
                        src="EXT:maps2/Resources/Public/JavaScript/GoogleMaps2.min.js"
                        async="1"
                        inline="0"
                        csp="1"/>
    </f:then>
    <f:else>
        <f:comment><!-- Do not activate async. Else "L" is not defined --></f:comment>
        <f:asset.css identifier="maps2-osm"
                     href="EXT:maps2/Resources/Public/Css/Leaflet/Leaflet.css"
                     inline="0"
                     csp="1"/>
        <f:asset.script identifier="maps2-osm-leaflet"
                        src="EXT:maps2/Resources/Public/JavaScript/leaflet.min.js"
                        async="0"
                        inline="0"
                        csp="1"/>
        <f:asset.script identifier="maps2-osm"
                        src="EXT:maps2/Resources/Public/JavaScript/OpenStreetMap2.min.js"
                        async="0"
                        inline="0"
                        csp="1"/>
    </f:else>
</f:if>
</html>
