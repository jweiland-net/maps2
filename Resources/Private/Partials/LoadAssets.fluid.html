<html lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:m="http://typo3.org/ns/JWeiland/Maps2/ViewHelpers"
      data-namespace-typo3-fluid="true">

<m:getEnvironment>
    <f:if condition="{environment.settings.mapProvider} == 'gm'">
        <f:then>
            <f:comment><!-- async has to be activated. Else "initMap" could not be found --></f:comment>
            <f:comment><!-- What a dump solution to add the nonce attribute to all dynamically generated style tags by Google Maps API --></f:comment>
            <f:asset.css identifier="maps2-google-maps" csp="1" priority="1">;</f:asset.css>
            <f:comment><!-- "settings" contains the FlexForm override of the maps2 plugin, "environment.settings" the TypoScript defaults --></f:comment>
            <f:comment><!-- Load MarkerClusterer in head (priority), so it is available before the async Google Maps scripts call "initMap", even if a later plugin on the page registers it. It needs "google.maps" on instantiation only --></f:comment>
            <f:if condition="{settings.markerClusterer.enable} || {environment.settings.markerClusterer.enable}">
                <f:asset.script identifier="maps2-google-maps-marker-clusterer"
                                src="EXT:maps2/Resources/Public/JavaScript/markerclusterer.min.js"
                                async="0"
                                inline="0"
                                priority="1"
                                csp="1"/>
            </f:if>
            <f:asset.script identifier="maps2-google-maps-api"
                            src="https://maps.googleapis.com/maps/api/js?key={environment.settings.googleMapsJavaScriptApiKey}&libraries=places&callback=initMap&loading=async"
                            async="1"
                            inline="0"
                            csp="1"/>
            <f:asset.script identifier="maps2-google-maps"
                            src="EXT:maps2/Resources/Public/JavaScript/GoogleMaps2.min.js"
                            async="1"
                            inline="0"
                            csp="1"/>
        </f:then>
        <f:else if="{environment.settings.mapProvider} == 'osm'">
            <f:comment><!-- Do not activate async. Else "L" is not defined --></f:comment>
            <f:asset.css identifier="maps2-osm"
                         href="EXT:maps2/Resources/Public/Css/Leaflet/Leaflet.css"
                         inline="0"
                         csp="1"/>
            <f:asset.script identifier="maps2-osm-leaflet"
                            src="EXT:maps2/Resources/Public/JavaScript/leaflet.min.js"
                            async="0"
                            inline="0"
                            csp="1"/>
            <f:comment><!-- "settings" contains the FlexForm override of the maps2 plugin, "environment.settings" the TypoScript defaults --></f:comment>
            <f:if condition="{settings.markerClusterer.enable} || {environment.settings.markerClusterer.enable}">
                <f:asset.css identifier="maps2-osm-marker-cluster"
                             href="EXT:maps2/Resources/Public/Css/Leaflet/MarkerCluster.css"
                             inline="0"
                             csp="1"/>
                <f:if condition="{environment.settings.markerClusterer.styleSheet}">
                    <f:asset.css identifier="maps2-osm-marker-cluster-theme"
                                 href="{environment.settings.markerClusterer.styleSheet}"
                                 inline="0"
                                 csp="1"/>
                </f:if>
                <f:asset.script identifier="maps2-osm-marker-cluster"
                                src="EXT:maps2/Resources/Public/JavaScript/leaflet.markercluster.min.js"
                                async="0"
                                inline="0"
                                csp="1"/>
            </f:if>
            <f:asset.script identifier="maps2-osm"
                            src="EXT:maps2/Resources/Public/JavaScript/OpenStreetMap2.min.js"
                            async="0"
                            inline="0"
                            csp="1"/>
        </f:else>
        <f:else>
            <p>No map provider configured. Please check Site Settings and Site Set Includes</p>
        </f:else>
    </f:if>
</m:getEnvironment>
</html>
