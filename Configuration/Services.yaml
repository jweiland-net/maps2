services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      'JWeiland\Maps2\Client\ClientInterface': '@maps2.mapProviderClient'
      'JWeiland\Maps2\Client\Request\RequestInterface': '@maps2.mapProviderRequest'

  JWeiland\Maps2\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  cache.maps2CachedHtml:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['maps2_cachedhtml']

  maps2.mapProviderClient:
    class: 'JWeiland\Maps2\Client\GoogleMapsClient'
    factory: ['@JWeiland\Maps2\Client\ClientFactory', 'create']
    arguments:
      - '@=service("JWeiland\\Maps2\\Helper\\MapHelper").getMapProvider()'

  maps2.columnRegistry:
    class: 'JWeiland\Maps2\Tca\ColumnRegistrationStorage'
    factory: ['@JWeiland\Maps2\Tca\Maps2Registry', 'getColumnRegistry']

  maps2.mapper:
    class: 'JWeiland\Maps2\Mapper\MapperInterface'
    factory: ['@JWeiland\Maps2\Mapper\MapperFactory', 'create']
    arguments:
      - '@=service("JWeiland\\Maps2\\Helper\\MapHelper").getMapProvider()'

  maps2.mapProviderRequest:
    class: 'JWeiland\Maps2\Client\Request\RequestInterface'
    factory: ['@JWeiland\Maps2\Client\Request\RequestFactory', 'create']
    arguments:
      - '@=service("JWeiland\\Maps2\\Helper\\MapHelper").getMapProvider()'

  # Called by makeInstance in TYPO3's PluginPreview
  JWeiland\Maps2\Backend\Preview\Maps2PluginPreview:
    public: true

  JWeiland\Maps2\Client\ClientFactory:
    arguments:
      $mapProviderClients: !tagged_iterator { tag: 'maps2.client.geocoding' }

  JWeiland\Maps2\Client\Request\RequestFactory:
    arguments:
      $mapProviderGeoCodingRequests: !tagged_iterator { tag: 'maps2.request.geocoding' }

  # Called by makeInstance in various TCA files
  JWeiland\Maps2\Configuration\ExtConf:
    public: true

  # Called by makeInstance in TYPO3's AbstractConditionMatcher
  JWeiland\Maps2\ExpressionLanguage\AllowMapProviderRequestFunctionsProvider:
    public: true

  # Called by makeInstance in TYPO3's NodeRegistry
  JWeiland\Maps2\Form\Element\ReadOnlyInputTextElement:
    public: true

  # Called by makeInstance in TYPO3's NodeRegistry
  JWeiland\Maps2\Form\FieldInformation\InfoWindowContent:
    public: true

  # Called by makeInstance in TYPO3's NodeRegistry
  JWeiland\Maps2\Form\Resolver\MapProviderResolver:
    public: true
    arguments:
      $mapProviderFormElements: !tagged_iterator { tag: 'maps2.form.element' }
      $mapProvider: '@=service("JWeiland\\Maps2\\Helper\\MapHelper").getMapProvider()'

  # Called by makeInstance in our PoiCollection
  JWeiland\Maps2\Helper\MapHelper:
    public: true

  # Called by makeInstance in our GetEnvironmentViewHelper
  JWeiland\Maps2\Helper\SettingsHelper:
    public: true

  # Called by makeInstance in TYPO3's DataHandler
  JWeiland\Maps2\Hook\CreateMaps2RecordHook:
    public: true
    arguments:
      $columnRegistry: '@maps2.columnRegistry'

  JWeiland\Maps2\Mapper\MapperFactory:
    arguments:
      $mapper: !tagged_iterator { tag: 'maps2.mapper' }

  JWeiland\Maps2\Service\GeoCodeService:
    arguments:
      $mapper: '@maps2.mapper'

  # Called by makeInstance in PoiCollection model to add foreign records
  JWeiland\Maps2\Service\MapService:
    public: true
    arguments:
      $columnRegistry: '@maps2.columnRegistry'

  JWeiland\Maps2\ViewHelpers\Cache\GetCacheViewHelper:
    arguments:
      $cache: '@cache.maps2CachedHtml'
  JWeiland\Maps2\ViewHelpers\Cache\HasCacheViewHelper:
    arguments:
      $cache: '@cache.maps2CachedHtml'
  JWeiland\Maps2\ViewHelpers\Cache\SetCacheViewHelper:
    arguments:
      $cache: '@cache.maps2CachedHtml'

  # Will be called by various TCA files
  JWeiland\Maps2\Tca\Maps2Registry:
    public: true
